specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Elk
providerId: elk
created: '2026-05-04'
modified: '2026-08-27'
generated: '2026-08-27'
method: probed
source: >-
  Live unauthenticated GET https://elk.zone/api/list-servers (HTTP 200, 2026-08-27,
  full response headers captured) plus a documentation search across
  https://docs.elk.zone and https://github.com/elk-zone/elk for published limits.
limit_count: 0
note: >-
  CORRECTION, 2026-08-27. This file previously carried five fabricated limits — 10
  req/min and 1,000 req/month "free", 100 req/min and 100,000 req/month "professional",
  1,000 req/min "enterprise", all keyed to an api-key scope Elk does not issue — written
  by the 2026-05-04 bulk scaffold sweep. None of them exist. They were replaced with this
  measured zero.
  Elk publishes no rate limits and returns no rate-limit headers. THIS IS AN HONEST ZERO,
  NOT AN UNCHECKED ONE: a live 200 was captured and its headers read. The limits that
  actually govern an Elk session are enforced by the user's own Mastodon instance against
  their own token, not by Elk.
limits: []
