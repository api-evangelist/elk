upstream_limits:
  - name: Mastodon instance rate limits
    enforced_by: the user's chosen Mastodon-compatible server, not Elk
    reference: https://docs.joinmastodon.org/api/rate-limits/
    note: >-
      Every Elk feature beyond the sign-in picker is a call to the user's instance,
      carrying that instance's own limits and its own X-RateLimit-* headers. They vary
      per instance and are outside Elk's control.
edge:
  provider: Netlify (origin) behind Cloudflare
  note: >-
    Infrastructure-level abuse protection may exist at the edge, but no limit, window, or
    header is published or observable, so none is recorded.
