note: >-
  Elk publishes NO client SDK. It is a deployable web application, not a library, so
  there is nothing here that a developer imports to call an API — which is why no
  `SDKs` pointer is emitted in apis.yml. What Elk does distribute is the application
  itself, as an OCI container image on GitHub Container Registry and as source for a
  Netlify/Cloudflare self-deploy. The npm name `@elk-zone/elk` appears in package.json
  but is NOT published to npm (registry.npmjs.org returned "Not found" on 2026-08-27);
  the unscoped npm package `elk` is an unrelated 2015 project by a different author and
  is not first-party.
