specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Elk
providerId: elk
created: '2026-05-04'
modified: '2026-08-27'
generated: '2026-08-27'
method: searched
source: >-
  https://docs.elk.zone/guide/sponsoring (HTTP 200, 2026-08-27),
  https://docs.elk.zone/guide (HTTP 200), https://elk.zone (HTTP 200),
  https://github.com/elk-zone/elk/blob/main/LICENSE
plan_count: 0
pricing_model: free-open-source
note: >-
  CORRECTION, 2026-08-27. This file previously carried three fabricated tiers — "Free"
  at 1,000 requests/month, "Professional" at 100,000 with TBD pricing, and an
  "Enterprise" tier with SLAs, data residency and a named account manager — written by
  the 2026-05-04 bulk scaffold sweep. None of them exist. They were replaced with this
  measured zero.
  Elk has NO plans, NO tiers, NO pricing page and NO paid product. It is MIT-licensed
  software offered free at elk.zone and free to self-host. The only monetary surface is
  voluntary GitHub Sponsors links for four individual maintainers (Anthony Fu, Daniel
  Roe, Kevin Deng, Patak) on the sponsoring page, which explicitly asks readers to also
  sponsor other contributors. That is donation, not a plan: it buys no quota, no
  support tier, and no access, and it is therefore not modelled as one here.
plans: []
funding:
  - kind: donation
    name: GitHub Sponsors (individual maintainers)
    url: https://docs.elk.zone/guide/sponsoring
    grants_access: false
    note: Voluntary support for named maintainers. Confers no entitlement, quota, or tier.
access:
  cost: free
  signup_required: false
  credential_required: false
  note: >-
    Users sign in with an existing account on a Mastodon-compatible server of their own
    choosing. Elk issues no account and no API key.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
