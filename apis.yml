apis:
  - aid: elk:elk-client-api
    name: Elk Client API
    description: >-
      Elk's own server surface, served by its Nuxt runtime at https://elk.zone/api. Four
      endpoints: list the Mastodon-compatible instances offered in the sign-in picker,
      build the instance authorize URL, complete the OAuth authorization-code callback,
      and (operator-only) clear a cached OAuth app registration. It is not a marketed,
      versioned or documented public API, and it is not the Mastodon API — timelines,
      posts and notifications are served by the user's own instance, not by Elk.
    humanURL: https://elk.zone
    baseURL: https://elk.zone/api
