aid: elk
name: Elk
description: >-
  Elk is a nimble, MIT-licensed Mastodon web client maintained by Anthony Fu, Daniel Roe,
  Kevin Deng and Patak. It runs as a Nuxt 4 progressive web app at elk.zone and connects
  to any Mastodon-compatible instance the user chooses, speaking the Mastodon Client API
  through Masto.js with WebSocket streaming and Web Push notifications. Elk sells no API
  product and issues no credential of its own: its small server surface at elk.zone/api
  exists to list sign-in instances and broker the OAuth 2.0 handshake with the user's own
  server, and every timeline, post and notification call goes to that instance directly.
